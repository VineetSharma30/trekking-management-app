{% extends "base.html" %}
{% block title %}Assign Staff{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Assign Staff</h2>
            <p class="text-muted mb-0">Assign an approved staff member to this trek.</p>
        </div>

        <a href="{{ url_for('admin.treks') }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>

    <div class="card">

        <div class="card-header py-3">
            <h5 class="mb-0">{{ trek.name }}</h5>
        </div>

        <div class="card-body">

            <div class="row mb-4">

                <div class="col-md-4">
                    <strong>Location</strong><br>
                    <span class="text-muted">{{ trek.location }}</span>
                </div>

                <div class="col-md-4">
                    <strong>Difficulty</strong><br>
                    <span class="text-muted">{{ trek.difficulty }}</span>
                </div>

                <div class="col-md-4">
                    <strong>Duration</strong><br>
                    <span class="text-muted">{{ trek.duration_days }} Days</span>
                </div>

            </div>

            <form method="POST">

                <div class="mb-4">

                    <label class="form-label">Select Staff Member</label>

                    <select name="staff_id" class="form-select" required>

						<option value="" disabled {% if not trek.assigned_staff_id %}selected{% endif %}>
							Select Staff
						</option>

						{% for staff in approved_staff %}

							<option value="{{ staff.id }}"
								{% if staff.id == trek.assigned_staff_id %}selected{% endif %}>
								{{ staff.full_name }}
							</option>

                        {% endfor %}

                    </select>

                </div>

                <div class="text-end">

                    <button class="btn btn-primary">
                        <i class="bi bi-person-check"></i>
                        Assign Staff
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
